<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRI Assistant</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#111;--text:#fff;--muted:#8a8a8a;--line:#2a2a2a}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:18px 24px;font-weight:600;letter-spacing:.2px}
#chat{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.msg{max-width:88%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg img{display:block;max-width:220px;border-radius:10px;margin-bottom:8px}
.empty{margin:auto;text-align:center;color:var(--muted)}
.bars{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);white-space:normal}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.row .n{width:110px;color:var(--muted)}
.row .b{flex:1;height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden}
.row .b i{display:block;height:100%;background:#fff}
.row .p{width:48px;text-align:right}
.err{border-style:dashed}
#composer{max-width:820px;width:calc(100% - 32px);margin:0 auto 18px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 12px 10px}
#chip{display:none;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:0 6px 8px}
#chip img{height:48px;border-radius:8px;border:1px solid var(--line)}
#chip a{cursor:pointer;color:var(--text);font-size:18px;line-height:1}
textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:4px 8px;max-height:160px}
textarea::placeholder{color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
button svg{width:18px;height:18px}
#attach{background:transparent;color:var(--text);border:1px solid var(--line)}
#attach:hover{background:#1c1c1c}
#send{background:#fff;color:#000;border:0}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<header>MRI Assistant</header>
<div id="chat"><div class="empty" id="empty">Attach an MRI image and add any clinical history.</div></div>
<div id="composer">
  <div id="chip"><img id="thumb" alt=""><span id="fname"></span><a id="rm" title="Remove">&times;</a></div>
  <textarea id="txt" rows="1" placeholder="Message"></textarea>
  <div class="tools">
    <input type="file" id="file" accept="image/*" hidden>
    <button id="attach" title="Attach MRI image" aria-label="Attach MRI image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="send" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), txt = $("txt"), fileIn = $("file"), send = $("send");
let history = [], file = null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}

function add(cls, html){
  const e = $("empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function bars(results){
  if (!results.length) return "";
  return '<div class="bars">' + results.map(r =>
    `<div class="row"><span class="n">${esc(r.label.replace(/_/g," "))}</span>` +
    `<span class="b"><i style="width:${(r.p*100).toFixed(1)}%"></i></span>` +
    `<span class="p">${(r.p*100).toFixed(1)}%</span></div>`).join("") + "</div>";
}

$("attach").onclick = () => fileIn.click();
fileIn.onchange = () => {
  file = fileIn.files[0] || null;
  if (!file) return;
  $("thumb").src = URL.createObjectURL(file);
  $("fname").textContent = file.name;
  $("chip").style.display = "flex";
};
$("rm").onclick = () => { file = null; fileIn.value = ""; $("chip").style.display = "none"; };

txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = txt.scrollHeight + "px"; });
txt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
send.onclick = go;

async function go(){
  const text = txt.value.trim();
  if (!text && !file) return;
  const img = file ? `<img src="${URL.createObjectURL(file)}" alt="">` : "";
  add("user", img + esc(text));

  const fd = new FormData();
  fd.append("message", text);
  fd.append("history", JSON.stringify(history));
  if (file) fd.append("image", file);

  txt.value = ""; txt.style.height = "auto";
  $("rm").onclick();
  send.disabled = true;
  const wait = add("bot", "Analyzing...");

  try {
    const r = await fetch("/analyze", {method: "POST", body: fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Server error");
    wait.innerHTML = fmt(data.answer) + bars(data.results);
    history.push({role: "user", content: text || "(MRI image uploaded)"});
    history.push({role: "assistant", content: data.answer});
  } catch (e) {
    wait.className = "msg bot err"; wait.textContent = "Error: " + e.message;
  }
  send.disabled = false; chat.scrollTop = chat.scrollHeight; txt.focus();
}
</script>
</body>
</html>
